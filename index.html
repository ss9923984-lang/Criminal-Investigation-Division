<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CID - Mobile Data Terminal (MDT)</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --panel-bg: #121a2d;
            --accent-blue: #0088ff;
            --accent-gold: #d4af37;
            --text-color: #e0e6ed;
            --danger-color: #ff4d4d;
            --success-color: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.2);
            width: 380px;
            text-align: center;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #1e2c4a;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            color: #8a9ba8;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
        }

        .badge { font-size: 40px; margin-bottom: 5px; }
        .auth-container h2 { color: var(--accent-gold); margin-bottom: 5px; }
        .auth-container p { font-size: 11px; color: #8a9ba8; margin-bottom: 15px; }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: var(--accent-blue);
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            background: #080d1a;
            border: 1px solid #1e2c4a;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent-blue);
        }

        button.main-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent-blue);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        button.main-btn:hover { background: #0066cc; }

        .msg-box {
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .mdt-container {
            display: none;
            width: 90%;
            max-width: 1000px;
            background: var(--panel-bg);
            border: 1px solid #1e2c4a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        header {
            background: #080d1a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
        }

        .agent-info span { color: var(--accent-gold); font-weight: bold; }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .panel {
            background: #0d1526;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #1e2c4a;
        }

        .panel h3 {
            color: var(--accent-blue);
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid #1e2c4a;
            padding-bottom: 5px;
        }

        .log-box {
            height: 150px;
            background: #050811;
            border: 1px solid #1e2c4a;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            color: var(--success-color);
        }

        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

    <!-- واجهة تسجيل الدخول والإنشاء -->
    <div class="auth-container" id="authScreen">
        <div class="badge">🛡️</div>
        <h2>CID FEDERAL MDT</h2>
        <p>CRIMINAL INVESTIGATION DIVISION</p>

        <div class="tabs">
            <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" id="registerTab" onclick="switchTab('register')">إنشاء حساب جديد</button>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div id="loginForm">
            <div class="input-group">
                <label>معرّف العميل (Agent ID)</label>
                <input type="text" id="loginAgent" placeholder="مثال: CID-402">
            </div>
            <div class="input-group">
                <label>رمز الأمان (PIN Code)</label>
                <input type="password" id="loginPin" placeholder="••••">
            </div>
            <button class="main-btn" onclick="login()">تسجيل الدخول للنظام</button>
        </div>

        <!-- نموذج إنشاء حساب جديد -->
        <div id="registerForm" style="display: none;">
            <div class="input-group">
                <label>اختر معرّف العميل (Agent ID)</label>
                <input type="text" id="regAgent" placeholder="مثال: CID-705">
            </div>
            <div class="input-group">
                <label>تعيين رمز الأمان (PIN Code)</label>
                <input type="password" id="regPin" placeholder="••••">
            </div>
            <button class="main-btn" style="background: var(--accent-gold); color: #000;" onclick="register()">تسجيل العميل في القاعدة</button>
        </div>

        <div class="msg-box" id="authMsg"></div>
    </div>

    <!-- واجهة الـ MDT الرئيسية -->
    <div class="mdt-container" id="mdtScreen">
        <header>
            <div><strong>CID SYSTEM v4.2</strong> | نظام التشفير الميداني</div>
            <div class="agent-info">العميل: <span id="displayAgent">CID-000</span> | الحالة: <span style="color: var(--success-color);">متصل</span></div>
            <button onclick="logout()" style="width: auto; padding: 5px 15px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">خروج</button>
        </header>

        <div class="main-content">
            <div class="panel">
                <h3>🔒 تشفير رسالة ميدانية</h3>
                <div class="input-group">
                    <label>الرسالة العادية</label>
                    <textarea id="plainText" rows="4" placeholder="أدخل النص المراد تشفيره..."></textarea>
                </div>
                <button class="main-btn" onclick="encryptMessage()">تشفير البيانات</button>
            </div>

            <div class="panel">
                <h3>🔓 فك تشفير رسالة</h3>
                <div class="input-group">
                    <label>الرمز المُشفّر</label>
                    <textarea id="cipherInput" rows="4" placeholder="أدخل الكود المُشفّر هنا..."></textarea>
                </div>
                <button class="main-btn" style="background: var(--accent-gold); color: #000;" onclick="decryptMessage()">فك التشفير</button>
            </div>

            <div class="panel full-width">
                <h3>📊 النتيجة وسجل العمليات (System Audit Log)</h3>
                <div class="input-group">
                    <label>النتيجة الحالية:</label>
                    <input type="text" id="resultOutput" readonly placeholder="ستظهر النتيجة هنا..." style="color: var(--accent-gold); font-weight: bold;">
                </div>
                <div class="log-box" id="systemLog">[SYSTEM READY]: تم تشغيل نظام التشفير الفدرالي...<br></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const regTab = document.getElementById('registerTab');
            const msgBox = document.getElementById('authMsg');
            msgBox.style.display = 'none';

            if (type === 'login') {
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
                loginTab.classList.add('active');
                regTab.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
                regTab.classList.add('active');
                loginTab.classList.remove('active');
            }
        }

        function getUsers() {
            return JSON.parse(localStorage.getItem('cid_users') || '{}');
        }

        function register() {
            const agent = document.getElementById('regAgent').value.trim();
            const pin = document.getElementById('regPin').value.trim();
            const msgBox = document.getElementById('authMsg');

            if (!agent || !pin) {
                showMsg('يرجى ملء جميع الحقول!', 'var(--danger-color)');
                return;
            }

            const users = getUsers();
            if (users[agent]) {
                showMsg('معرّف العميل هذا مسجّل بالفعل!', 'var(--danger-color)');
                return;
            }

            users[agent] = pin;
            localStorage.setItem('cid_users', JSON.stringify(users));
            showMsg('تم تسجيل الحساب بنجاح! يمكنك الآن تسجيل الدخول.', 'var(--success-color)');
            setTimeout(() => switchTab('login'), 1500);
        }

        function login() {
            const agent = document.getElementById('loginAgent').value.trim();
            const pin = document.getElementById('loginPin').value.trim();
            const users = getUsers();

            if (users[agent] && users[agent] === pin) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mdtScreen').style.display = 'block';
                document.getElementById('displayAgent').innerText = agent;
                addLog("تم تسجيل الدخول بنجاح بواسطة العميل: " + agent);
            } else {
                showMsg('بيانات الدخول غير صحيحة أو الحساب غير موجود!', 'var(--danger-color)');
            }
        }

        function logout() {
            document.getElementById('mdtScreen').style.display = 'none';
            document.getElementById('authScreen').style.display = 'block';
            document.getElementById('loginPin').value = '';
            document.getElementById('authMsg').style.display = 'none';
        }

        function showMsg(text, color) {
            const msgBox = document.getElementById('authMsg');
            msgBox.innerText = text;
            msgBox.style.color = color;
            msgBox.style.display = 'block';
        }

        function encryptMessage() {
            const input = document.getElementById('plainText').value;
            if (!input) return;
            const encoded = btoa(unescape(encodeURIComponent(input)));
            document.getElementById('resultOutput').value = `CID-SEC-${encoded}`;
            addLog(`[تشفير]: تم تشفير نص بطول ${input.length} حرف.`);
        }

        function decryptMessage() {
            let input = document.getElementById('cipherInput').value.trim();
            if (!input) return;
            if (input.startsWith("CID-SEC-")) input = input.replace("CID-SEC-", "");
            try {
                const decoded = decodeURIComponent(escape(atob(input)));
                document.getElementById('resultOutput').value = decoded;
                addLog(`[فك تشفير]: تم فك تشفير الرسالة بنجاح.`);
            } catch (e) {
                document.getElementById('resultOutput').value = "❌ خطأ: كود التشفير غير صالح!";
                addLog(`[خطأ]: محاولة فك تشفير رمز غير صالح.`);
            }
        }

        function addLog(message) {
            const logBox = document.getElementById('systemLog');
            const timestamp = new Date().toLocaleTimeString('ar-EG');
            logBox.innerHTML += `[${timestamp}] ${message}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>
